<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-14EL7NXW9X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-14EL7NXW9X');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL 5대5 내전 도우미</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 LoL 5대5 내전 도우미</h1>
            <div class="tabs">
                <button class="tab-btn active" data-tab="team-assignment">팀 배정</button>
                <button class="tab-btn" data-tab="fearless">피어리스 밴픽</button>
            </div>
        </header>

        <!-- 팀 배정 섹션 -->
        <div id="team-assignment" class="tab-content active">
            <div class="section">
                <h2>팀 이름 설정</h2>
                <div class="team-name-inputs">
                    <div class="team-name-group">
                        <label for="team-a-name">팀 A 이름:</label>
                        <input type="text" id="team-a-name" placeholder="TEAM A" maxlength="20" value="TEAM A">
                    </div>
                    <div class="team-name-group">
                        <label for="team-b-name">팀 B 이름:</label>
                        <input type="text" id="team-b-name" placeholder="TEAM B" maxlength="20" value="TEAM B">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>플레이어 입력 (10명)</h2>
                <div id="player-cards-container"></div>
                <div class="button-group">
                    <button id="random-assign-btn" class="btn btn-secondary">완전 랜덤 배정</button>
                    <button id="balanced-assign-btn" class="btn btn-primary">티어 밸런스 배정</button>
                </div>
            </div>

            <!-- 결과 표시 -->
            <div id="team-result" class="section" style="display: none;">
                <h2>팀 배정 결과</h2>
                <div class="teams-container">
                    <div class="team team-a">
                        <h3 class="team-a-header">TEAM A</h3>
                        <div class="team-score">티어 합: <span id="team-a-score">0</span></div>
                        <div id="team-a-roster"></div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="team team-b">
                        <h3 class="team-b-header">TEAM B</h3>
                        <div class="team-score">티어 합: <span id="team-b-score">0</span></div>
                        <div id="team-b-roster"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 피어리스 밴픽 섹션 -->
        <div id="fearless" class="tab-content">
            <div class="section">
                <h2>피어리스 밴픽 설정</h2>
                <div class="fearless-controls">
                    <div class="control-group">
                        <label>시리즈 형식:</label>
                        <select id="series-type">
                            <option value="3">Bo3 (3판 2선승)</option>
                            <option value="5">Bo5 (5판 3선승)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <button id="reset-fearless-btn" class="btn btn-danger">초기화</button>
                    </div>
                </div>

                <div class="game-info">
                    <h3>현재: <span id="current-game">Game 1</span></h3>
                    <p class="info-text">사용 금지된 챔피언: <span id="banned-count">0</span>개</p>
                </div>

                <div class="champion-selector">
                    <h3>챔피언 선택</h3>

                    <!-- 라인별 필터링 탭 -->
                    <div class="role-tabs">
                        <button class="role-tab active" data-role="ALL">전체</button>
                        <button class="role-tab" data-role="TOP">탑</button>
                        <button class="role-tab" data-role="JUNGLE">정글</button>
                        <button class="role-tab" data-role="MID">미드</button>
                        <button class="role-tab" data-role="ADC">원딜</button>
                        <button class="role-tab" data-role="SUPPORT">서포터</button>
                    </div>

                    <input type="text" id="champion-search" placeholder="챔피언 검색...">
                    <div id="champion-list" class="champion-grid"></div>
                </div>

                <div class="current-picks">
                    <div class="picks-section team-a-side">
                        <div class="banpick-header ban-header">
                            <span class="team-badge team-a-ban-header">TEAM A</span>
                            <span class="ban-badge">BAN <span id="team-a-ban-count">0/5</span></span>
                        </div>
                        <div id="team-a-bans" class="champion-tags"></div>
                        <div class="banpick-header pick-header">
                            <span class="team-badge team-a-pick-header">TEAM A</span>
                            <span class="pick-badge">PICK <span id="team-a-pick-count">0/5</span></span>
                        </div>
                        <div id="team-a-picks" class="champion-tags"></div>
                    </div>
                    <div class="vs-divider-small">VS</div>
                    <div class="picks-section team-b-side">
                        <div class="banpick-header ban-header">
                            <span class="team-badge team-b-ban-header">TEAM B</span>
                            <span class="ban-badge">BAN <span id="team-b-ban-count">0/5</span></span>
                        </div>
                        <div id="team-b-bans" class="champion-tags"></div>
                        <div class="banpick-header pick-header">
                            <span class="team-badge team-b-pick-header">TEAM B</span>
                            <span class="pick-badge">PICK <span id="team-b-pick-count">0/5</span></span>
                        </div>
                        <div id="team-b-picks" class="champion-tags"></div>
                    </div>
                </div>

                <div class="button-group">
                    <button id="confirm-game-btn" class="btn btn-primary">게임 확정 (다음 게임으로)</button>
                    <button id="prev-game-btn" class="btn btn-secondary">이전 게임 보기</button>
                </div>

                <div id="game-history" class="section">
                    <h3>게임 기록</h3>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
